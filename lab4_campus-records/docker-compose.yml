# Campus Records - three containers sharing one SQLite database volume
#   migrate   : runs once, copies JSON/CSV data into SQLite, then exits
#   api       : FastAPI REST API         -> http://localhost:8000/docs
#   db-viewer : web UI to browse the DB  -> http://localhost:8080
services:
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      DB_PATH: /db/app.db
    volumes:
      - db-data:/db

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DB_PATH: /db/app.db
    volumes:
      - db-data:/db
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db-viewer:
    image: coleifer/sqlite-web:latest
    command: ["sqlite_web", "--host", "0.0.0.0", "--port", "8080", "--read-only", "/db/app.db"]
    volumes:
      - db-data:/db
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
